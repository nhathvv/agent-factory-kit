<h1>Agent Factory Kit <span>1 outcome đi từ mandate đến done</span></h1>
<figure class="stage" role="img" aria-label="Luồng một outcome trong Agent Factory Kit, kể theo 9 bước.">
<span class="sr">Một outcome đi từ mandate đến done: Orchestrator điều phối, Owner làm, reviewer độc lập, Human giữ các cổng. Human giao mandate cho Orchestrator. Một lần đồng ý phủ cả kế hoạch đã duyệt. Orchestrator không viết product code: nó điều tra, mở một issue cho mỗi outcome, rồi giao việc. Owner làm trọn outcome trong worktree và branch riêng; implementer chỉ nhận một task có phạm vi. Mỗi PR do một agent không viết code review. Finding phải được sửa hoặc phản bác với bằng chứng. Orchestrator chỉ clear đúng một commit SHA: kiểm phạm vi, thứ tự, xung đột. Không review lại code. Release, deploy, migration, credentials: thực thi luôn cần Human nói rõ một chữ yes. Chỉ khi được kiểm chứng mới là done. Mỗi báo cáo kết thúc bằng Needs you: hành động hoặc nothing. Toàn cảnh: mọi vòng chạy theo cùng một luật, và quyền quyết định cuối vẫn thuộc Human.</span>
